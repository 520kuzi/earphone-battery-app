name: EarphoneBattery
options:
  bundleIdPrefix: com.battery
  xcodeVersion: "15.0"
targets:
  EarphoneBattery:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AppMain.swift
      - path: BatteryManager.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.battery.earphone
        INFOPLIST_FILE: Info.plist
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        EXPANDED_CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
